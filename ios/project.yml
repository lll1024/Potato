name: Potato
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.12.2
  Factory:
    url: https://github.com/hmlongco/Factory.git
    exactVersion: 3.5.2
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.12.0
  SwiftNavigation:
    url: https://github.com/pointfreeco/swift-navigation.git
    exactVersion: 2.11.2
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    exactVersion: 1.19.7
targets:
  SessionKit:
    type: framework
    platform: iOS
    sources: [SessionKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potato.SessionKit
    dependencies:
      - package: Alamofire
      - package: GRDB
  Potato:
    type: application
    platform: iOS
    sources: [Potato]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potato.travel
        INFOPLIST_KEY_CFBundleDisplayName: Potato
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    dependencies:
      - target: SessionKit
      - package: Factory
        product: FactoryKit
      - package: SwiftNavigation
        product: SwiftUINavigation
      - package: MarkdownUI
  PotatoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PotatoTests]
    dependencies:
      - target: Potato
      - target: SessionKit
      - package: SnapshotTesting
      - package: Alamofire
  PotatoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PotatoUITests]
    dependencies:
      - target: Potato
schemes:
  Potato:
    build:
      targets:
        Potato: all
    test:
      gatherCoverageData: true
      targets: [PotatoTests, PotatoUITests]
